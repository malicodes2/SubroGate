steps:
  # 1. Build container image using production Dockerfile
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/subrogate-backend:$COMMIT_SHA', '-t', 'gcr.io/$PROJECT_ID/subrogate-backend:latest', '.']

  # 2. Push container image to Google Container Registry / Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/subrogate-backend:$COMMIT_SHA']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/subrogate-backend:latest']

  # 3. Deploy to Google Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'subrogate-backend'
      - '--image'
      - 'gcr.io/$PROJECT_ID/subrogate-backend:$COMMIT_SHA'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--memory'
      - '1Gi'
      - '--cpu'
      - '1'
      - '--min-instances'
      - '0'
      - '--max-instances'
      - '10'
      - '--set-env-vars'
      - 'SUBROGATE_ENV=production,SUBROGATE_GEMINI_MODEL=gemini-3.5-flash,SUBROGATE_USE_VERTEX=true,GOOGLE_CLOUD_LOCATION=us-central1'

images:
  - 'gcr.io/$PROJECT_ID/subrogate-backend:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/subrogate-backend:latest'

options:
  logging: CLOUD_LOGGING_ONLY
