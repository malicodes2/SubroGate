name: Deploy SubroGate to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      api_base_url:
        description: 'Google Cloud Run Backend API URL (e.g. https://subrogate-backend-xxx.a.run.app)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Production Frontend
        working-directory: frontend
        env:
          VITE_API_BASE_URL: ${{ inputs.api_base_url || secrets.VITE_API_BASE_URL || '' }}
          VITE_BASE_PATH: './'
        run: npm run build

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./frontend/dist
